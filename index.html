<!doctype html>
<html lang="en" class="h-full preload" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <link rel="icon" type="image/x-icon" href="%BASE_URL%images/Favicon.svg" />

    <!-- Preload styles -->
    <style>
      /* VaultFront theme tokens — dark (default) */
      :root,
      [data-vaultfront-theme="vaultfront"] {
        --vf-bg: #05070d;
        --vf-surface: #0b101c;
        --vf-surface-alt: #111827;
        --vf-border: rgba(255, 255, 255, 0.08);
        --vf-text: #eef2ff;
        --vf-text-muted: #bac4da;
        --vf-accent-blue: #1fa2ff;
        --vf-accent-orange: #ff7a00;
        --vf-accent-gold: #ffc400;
        --vf-accent-green: #22c55e;
        --vf-accent-red: #ef4444;
        --vf-shadow: 0 24px 70px rgba(0, 0, 0, 0.42);
      }

      /* VaultFront light theme */
      [data-vaultfront-theme="light"] {
        --vf-bg: #f0f4ff;
        --vf-surface: #ffffff;
        --vf-surface-alt: #e8edf8;
        --vf-border: rgba(0, 0, 0, 0.1);
        --vf-text: #111827;
        --vf-text-muted: #4b5563;
        --vf-accent-blue: #0070cc;
        --vf-accent-orange: #c45200;
        --vf-accent-gold: #a67c00;
        --vf-accent-green: #16a34a;
        --vf-accent-red: #dc2626;
        --vf-shadow: 0 4px 24px rgba(0, 0, 0, 0.12);
      }

      /* VaultFront competitive theme */
      [data-vaultfront-theme="competitive"] {
        --vf-bg: #0a0010;
        --vf-surface: #12001e;
        --vf-surface-alt: #1c0030;
        --vf-border: rgba(180, 0, 255, 0.15);
        --vf-text: #f5eeff;
        --vf-text-muted: #c4aedd;
        --vf-accent-blue: #7c3aed;
        --vf-accent-orange: #f59e0b;
        --vf-accent-gold: #fbbf24;
        --vf-accent-green: #10b981;
        --vf-accent-red: #f43f5e;
        --vf-shadow: 0 24px 70px rgba(100, 0, 200, 0.3);
      }

      /* ID specificity keeps the drawer state authoritative over
                     generated transform utilities on every Tailwind build. */
      #sidebar-menu {
        transform: translateX(-100%);
      }

      #sidebar-menu.open {
        transform: translateX(0);
      }

      desktop-nav-bar .nav-menu-item {
        min-width: 44px;
        min-height: 44px;
      }

      .preload {
        visibility: hidden;
        opacity: 0;
        transition: opacity 0.5s ease-out;
      }

      /* iOS safe area support */
      body {
        padding-top: env(safe-area-inset-top);
        padding-right: env(safe-area-inset-right);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
      }

      /* Ensure full viewport height on iOS */
      html,
      body {
        height: 100%;
        height: -webkit-fill-available;
        min-height: 100%;
        min-height: -webkit-fill-available;
      }
    </style>

    <!-- Scripts -->
    <script>
      // Module scripts finish before DOMContentLoaded. Reveal the usable shell
      // there instead of waiting for every deferred media request: keeping the
      // root hidden until window.load makes first paint depend on audio/images.
      window.addEventListener("DOMContentLoaded", function () {
        requestAnimationFrame(() => {
          document.documentElement.classList.remove("preload");
        });
      });

      // Fallback: remove preload class after timeout in case DOMContentLoaded never fires
      setTimeout(function () {
        document.documentElement.classList.remove("preload");
      }, 1000);
    </script>

    <script>
      // Fallback sidebar toggle so hamburger works even if module bundle fails to load
      window.__toggleSidebar = function (e) {
        try {
          const sidebar = document.getElementById("sidebar-menu");
          const backdrop = document.getElementById("mobile-menu-backdrop");
          if (!sidebar || !backdrop) return;

          const isOpen = sidebar.classList.contains("open");

          if (isOpen) {
            sidebar.classList.remove("open");
            backdrop.classList.remove("open");
            document.documentElement.classList.remove("overflow-hidden");
            sidebar.setAttribute("aria-hidden", "true");
            sidebar.removeAttribute("aria-modal");
            backdrop.setAttribute("aria-hidden", "true");
          } else {
            sidebar.classList.add("open");
            backdrop.classList.add("open");
            document.documentElement.classList.add("overflow-hidden");
            sidebar.setAttribute("aria-hidden", "false");
            sidebar.setAttribute("aria-modal", "true");
            backdrop.setAttribute("aria-hidden", "false");
          }

          const hb = document.getElementById("hamburger-btn");
          if (hb) hb.setAttribute("aria-expanded", (!isOpen).toString());
        } catch (err) {
          console.error("Toggle failed", err);
        }
      };

      // Wire up the hamburger button inline
      const hamburger = document.getElementById("hamburger-btn");
      if (hamburger) {
        hamburger.onclick = window.__toggleSidebar;
        hamburger.setAttribute("aria-expanded", "false");
      }

      // Wire up backdrop click to close menu
      const backdrop = document.getElementById("mobile-menu-backdrop");
      if (backdrop) {
        backdrop.onclick = function (e) {
          const sidebar = document.getElementById("sidebar-menu");
          if (sidebar && sidebar.classList.contains("open")) {
            window.__toggleSidebar(e);
          }
        };
      }

      // Wire up Escape key to close menu
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" || e.key === "Esc") {
          const sidebar = document.getElementById("sidebar-menu");
          if (sidebar && sidebar.classList.contains("open")) {
            window.__toggleSidebar(e);
          }
        }
      });
    </script>
