name: Configure email routing

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Plan or apply the bounded VaultFront contact route"
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply

permissions:
  contents: read

jobs:
  email-routing:
    name: ${{ inputs.mode == 'apply' && 'Apply email routing' || 'Plan email routing' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      DOMAIN: ${{ vars.DOMAIN || 'vaultfront.io' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure bounded contact route
        env:
          APPLY: ${{ inputs.mode == 'apply' && '1' || '0' }}
        run: |
          set -euo pipefail
          if [[ "$APPLY" == "1" ]]; then
            node scripts/configure-email-routing.mjs --apply
          else
            node scripts/configure-email-routing.mjs
          fi

      - name: Upload email-routing receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: email-routing-${{ github.run_id }}
          path: .cache/release-evidence/email-routing-receipt.json
          if-no-files-found: warn
          retention-days: 90
