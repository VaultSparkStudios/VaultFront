name: Promote verified digest

on:
  workflow_dispatch:
    inputs:
      staging_run_id:
        description: "Successful Deploy staging workflow run ID"
        required: true
        type: string
      operation:
        description: "Promotion intent; rollback requires independently admitted replaced evidence"
        required: true
        default: promotion
        type: choice
        options:
          - promotion
          - rollback
      replaced_staging_run_id:
        description: "Rollback only: staging run for the currently deployed revision"
        required: false
        default: ""
        type: string
      rollback_reason:
        description: "Rollback only: durable incident/decision reason"
        required: false
        default: ""
        type: string
      validation_run_id:
        description: "Live only: successful dry-run Promote workflow run ID with identical intent"
        required: false
        default: ""
        type: string
      target_subdomain:
        description: "Production subdomain; main targets the apex domain"
        required: true
        default: "main"
        type: string
      dry_run:
        description: "Validate promotion without connecting to production"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  promote:
    name: ${{ inputs.dry_run && 'Validate promotion' || 'Promote verified digest' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      DOMAIN: ${{ vars.DOMAIN }}
      SUBDOMAIN: ${{ inputs.target_subdomain }}
      FQDN: ${{ inputs.target_subdomain == 'main' && vars.DOMAIN || format('{0}.{1}', inputs.target_subdomain, vars.DOMAIN) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate repository promotion contract
        run: |
          node scripts/check-deploy-contract.mjs
          node scripts/check-release-input-trust.mjs

      - name: Admit same-repository successful staging run
        id: attestation
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
          IS_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          [[ "$STAGING_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          if [[ "$IS_DRY_RUN" != "true" ]]; then
            node scripts/check-release-input-trust.mjs --release
          fi
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${STAGING_RUN_ID}" > staging-run.json
          mkdir -p .staging-attestation
          gh run download "$STAGING_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "staging-attestation-${STAGING_RUN_ID}" --dir .staging-attestation
          node scripts/staging-attestation.mjs verify --attestation .staging-attestation/staging-attestation.json --run-metadata staging-run.json --repository "$GITHUB_REPOSITORY"

      - name: Admit replaced revision evidence for rollback
        id: replaced_attestation
        if: ${{ inputs.operation == 'rollback' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPLACED_STAGING_RUN_ID: ${{ inputs.replaced_staging_run_id }}
        run: |
          set -euo pipefail
          [[ "$REPLACED_STAGING_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$REPLACED_STAGING_RUN_ID" != "${{ inputs.staging_run_id }}" ]]
          test -n "${{ inputs.rollback_reason }}"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${REPLACED_STAGING_RUN_ID}" > replaced-staging-run.json
          mkdir -p .replaced-staging-attestation
          gh run download "$REPLACED_STAGING_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "staging-attestation-${REPLACED_STAGING_RUN_ID}" --dir .replaced-staging-attestation
          node scripts/staging-attestation.mjs verify --attestation .replaced-staging-attestation/staging-attestation.json --run-metadata replaced-staging-run.json --repository "$GITHUB_REPOSITORY"

      - name: Exercise dry-run promotion
        if: ${{ inputs.dry_run }}
        env:
          DEPLOY_DRY_RUN: "1"
          DEPLOY_HEALTH_URL: https://${{ env.FQDN }}/_health
          DEPLOY_INGRESS_PORT: "8999"
          DEPLOY_STAGING_ATTESTATION: ${{ steps.attestation.outputs.image_digest }}
          GHCR_REPO: ${{ vars.GHCR_REPO || 'vaultfront' }}
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME || 'vaultsparkstudios' }}
        run: ./deploy.sh prod primary "${{ steps.attestation.outputs.image_digest }}" "$SUBDOMAIN"

      - name: Require CANON-038 live allocation
        if: ${{ !inputs.dry_run }}
        env:
          DEPLOY_INGRESS_PORT: ${{ vars.DEPLOY_INGRESS_PORT }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_INGRESS_PORT" =~ ^[0-9]+$ ]]
          ((DEPLOY_INGRESS_PORT >= 8110 && DEPLOY_INGRESS_PORT <= 8999))

      - name: Create dry-run validation receipt
        if: ${{ inputs.dry_run }}
        env:
          OPERATION: ${{ inputs.operation }}
          ROLLBACK_REASON: ${{ inputs.rollback_reason }}
        run: |
          set -euo pipefail
          args=(
            create-validation
            --repository "$GITHUB_REPOSITORY"
            --workflow-run-id "$GITHUB_RUN_ID"
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT"
            --operation "$OPERATION"
            --target-subdomain "$SUBDOMAIN"
            --staging-run-id "${{ inputs.staging_run_id }}"
            --target-attestation .staging-attestation/staging-attestation.json
            --output promotion-validation.json
          )
          if [[ "$OPERATION" == "rollback" ]]; then
            args+=(
              --replaced-staging-run-id "${{ inputs.replaced_staging_run_id }}"
              --replaced-attestation .replaced-staging-attestation/staging-attestation.json
              --rollback-reason "$ROLLBACK_REASON"
            )
          fi
          node scripts/promotion-receipt.mjs "${args[@]}"

      - name: Retain dry-run validation receipt
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: promotion-validation-${{ github.run_id }}
          path: promotion-validation.json
          retention-days: 90

      - name: Admit matching successful dry-run validation
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION: ${{ inputs.operation }}
          ROLLBACK_REASON: ${{ inputs.rollback_reason }}
          VALIDATION_RUN_ID: ${{ inputs.validation_run_id }}
        run: |
          set -euo pipefail
          [[ "$VALIDATION_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$VALIDATION_RUN_ID" != "$GITHUB_RUN_ID" ]]
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${VALIDATION_RUN_ID}" > validation-run.json
          mkdir -p .promotion-validation
          gh run download "$VALIDATION_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "promotion-validation-${VALIDATION_RUN_ID}" --dir .promotion-validation
          args=(
            verify-validation
            --receipt .promotion-validation/promotion-validation.json
            --run-metadata validation-run.json
            --repository "$GITHUB_REPOSITORY"
            --operation "$OPERATION"
            --target-subdomain "$SUBDOMAIN"
            --staging-run-id "${{ inputs.staging_run_id }}"
            --target-attestation-digest "${{ steps.attestation.outputs.attestation_digest }}"
          )
          if [[ "$OPERATION" == "rollback" ]]; then
            args+=(
              --replaced-staging-run-id "${{ inputs.replaced_staging_run_id }}"
              --replaced-attestation-digest "${{ steps.replaced_attestation.outputs.attestation_digest }}"
              --rollback-reason "$ROLLBACK_REASON"
            )
          fi
          node scripts/promotion-receipt.mjs "${args[@]}"

      - name: Require exact canonical release admission
        if: ${{ !inputs.dry_run }}
        env:
          STAGING_ORIGIN: ${{ steps.attestation.outputs.origin }}
        run: |
          set -euo pipefail
          curl -fsS --max-time 10 "$STAGING_ORIGIN/api/vaultfront/readiness" -o release-readiness.json
          curl -fsS --max-time 10 "$STAGING_ORIGIN/commit.txt" -o release-revision.txt
          node scripts/release-admission.mjs \
            --readiness release-readiness.json \
            --revision release-revision.txt \
            --attestation .staging-attestation/staging-attestation.json \
            --repository "$GITHUB_REPOSITORY" \
            --origin "$STAGING_ORIGIN" \
            --output release-admission.json

      - name: Log in to GitHub Container Registry
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ vars.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Resolve promoted image revision
        if: ${{ !inputs.dry_run }}
        env:
          IMAGE_DIGEST: ${{ steps.attestation.outputs.image_digest }}
          ATTESTED_GIT_SHA: ${{ steps.attestation.outputs.git_sha }}
          GHCR_REPO: ${{ vars.GHCR_REPO }}
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME }}
        run: |
          set -euo pipefail
          IMAGE_REF="ghcr.io/${GHCR_USERNAME}/${GHCR_REPO}@${IMAGE_DIGEST}"
          docker pull "$IMAGE_REF"
          EXPECTED_GIT_SHA="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE_REF")"
          [[ "$EXPECTED_GIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_GIT_SHA" == "$ATTESTED_GIT_SHA" ]]
          echo "EXPECTED_GIT_SHA=$EXPECTED_GIT_SHA" >> "$GITHUB_ENV"

      - name: Create SSH private key
        if: ${{ !inputs.dry_run }}
        env:
          DEPLOY_SERVER_HOST: ${{ secrets.DEPLOY_SERVER_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          test -n "$DEPLOY_SERVER_HOST"
          chmod 600 ~/.ssh/id_rsa
          ssh-keygen -y -f ~/.ssh/id_rsa > /dev/null
          node scripts/prepare-deploy-ssh.mjs ~/.ssh/known_hosts

      - name: Deploy promoted digest
        if: ${{ !inputs.dry_run }}
        env:
          APP_NAME: vaultfront
          API_KEY: ${{ secrets.API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          DEPLOY_HEALTH_URL: https://${{ env.FQDN }}/_health
          DEPLOY_INGRESS_PORT: ${{ vars.DEPLOY_INGRESS_PORT }}
          DEPLOY_REMOTE_USER: ${{ vars.DEPLOY_REMOTE_USER || 'vaultfront' }}
          DEPLOY_SERVER_HOST: ${{ secrets.DEPLOY_SERVER_HOST }}
          DEPLOY_STAGING_ATTESTATION: ${{ steps.attestation.outputs.image_digest }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GHCR_REPO: ${{ vars.GHCR_REPO }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME }}
          OTEL_AUTH_HEADER: ${{ secrets.OTEL_AUTH_HEADER }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OBELISK_CLIENT_ID: ${{ vars.OBELISK_CLIENT_ID }}
          OBELISK_COOKIE_SECRET: ${{ secrets.OBELISK_COOKIE_SECRET }}
          OBELISK_ISSUER: ${{ vars.OBELISK_ISSUER }}
          OBELISK_REDIRECT_URI: ${{ vars.OBELISK_REDIRECT_URI }}
          SSH_KEY: ~/.ssh/id_rsa
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: |
          echo "PROMOTION_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          ./deploy.sh prod primary "${{ steps.attestation.outputs.image_digest }}" "$SUBDOMAIN"

      - name: Verify promoted revision
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            curl -fsS --max-time 5 "https://${FQDN}/_health" -o production-health.json || true
            curl -fsS --max-time 5 "https://${FQDN}/commit.txt" -o production-revision.txt || true
            if [[ "$(cat production-revision.txt 2>/dev/null || true)" == "$EXPECTED_GIT_SHA" ]] && [[ -s production-health.json ]]; then
              echo "Verified promoted revision ${EXPECTED_GIT_SHA}" >> "$GITHUB_STEP_SUMMARY"
              break
            fi
            if [[ "$attempt" == "30" ]]; then
              echo "Promotion revision verification timed out" >&2
              exit 1
            fi
            sleep 10
          done

      - name: Create and self-verify retained outcome receipt
        if: ${{ !inputs.dry_run }}
        env:
          OPERATION: ${{ inputs.operation }}
          ROLLBACK_REASON: ${{ inputs.rollback_reason }}
        run: |
          set -euo pipefail
          args=(
            create-outcome
            --validation-receipt .promotion-validation/promotion-validation.json
            --validation-run-metadata validation-run.json
            --repository "$GITHUB_REPOSITORY"
            --workflow-run-id "$GITHUB_RUN_ID"
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT"
            --operation "$OPERATION"
            --target-subdomain "$SUBDOMAIN"
            --staging-run-id "${{ inputs.staging_run_id }}"
            --target-attestation-digest "${{ steps.attestation.outputs.attestation_digest }}"
            --production-origin "https://${FQDN}"
            --health-response production-health.json
            --revision-response production-revision.txt
            --started-at "$PROMOTION_STARTED_AT"
            --output promotion-outcome.json
          )
          if [[ "$OPERATION" == "rollback" ]]; then
            args+=(
              --replaced-staging-run-id "${{ inputs.replaced_staging_run_id }}"
              --replaced-attestation-digest "${{ steps.replaced_attestation.outputs.attestation_digest }}"
              --rollback-reason "$ROLLBACK_REASON"
            )
          fi
          node scripts/promotion-receipt.mjs "${args[@]}"
          node scripts/promotion-receipt.mjs verify-outcome --receipt promotion-outcome.json

      - name: Retain promotion or rollback outcome receipt
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: promotion-outcome-${{ github.run_id }}
          path: |
            promotion-outcome.json
            release-admission.json
          retention-days: 90
