name: Deploy VaultFront Public Surface

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build deterministic public artifact
        env:
          VITE_APP_BASE_PATH: /vaultfront/
          PAGES_GIT_COMMIT: ${{ github.sha }}
          PAGES_INSTANCE_ID: github-pages
        run: npm run build:pages

      - name: Verify public artifact contract
        run: node scripts/check-pages-deploy-contract.mjs --artifact static

      - name: Upload verified public artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: static

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
