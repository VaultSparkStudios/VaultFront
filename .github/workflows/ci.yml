name: 🧪 CI

on:
  merge_group:
    types:
      - checks_requested
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
      - run: npm ci
      - run: npm run build-prod
      - name: Hash complete build artifact
        run: node scripts/build-artifact-manifest.mjs --root static --output build-artifact-manifest.json --revision "$GITHUB_SHA"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: static-build-${{ github.sha }}
          path: |
            static/
            build-artifact-manifest.json
          include-hidden-files: true
          retention-days: 7
  test:
    name: 🔬 Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
      - run: npm ci
      - run: npm run test:coverage
      - name: Verify source-of-truth contracts
        run: npm run verify:contracts
      - name: Enforce checked-in coverage ratchet
        run: node scripts/check-coverage-ratchet.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
          retention-days: 7

  eslint:
    name: 🔍 ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.13.0"
          cache: "npm"
      - run: npm ci
      - run: npx eslint --format gha

  prettier:
    name: 🎨 Prettier
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.13.0"
          cache: "npm"
      - run: npm ci
      - run: npm run format:check

  security-audit:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.13.0"
          cache: "npm"
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=moderate

  bundle-size:
    name: 📦 Bundle Size
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.13.0"
          cache: "npm"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: static-build-${{ github.sha }}
          path: .
      - name: Verify exact build artifact
        run: node scripts/build-artifact-manifest.mjs --root static --output build-artifact-manifest.json --verify
      - name: Check bundle sizes
        run: npm run bundle:check

  release-evidence:
    name: 🧾 Exact-revision release evidence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build, test, eslint, prettier, security-audit, bundle-size]
    steps:
      - name: Checkout verified revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: static-build-${{ github.sha }}
          path: .
      - name: Verify exact build artifact before projecting evidence
        run: node scripts/build-artifact-manifest.mjs --root static --output build-artifact-manifest.json --verify
      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.13.0"
          cache: "npm"
      - name: Generate post-verification evidence
        env:
          VAULTFRONT_CI_VERIFICATION_COMPLETE: "true"
          VAULTFRONT_CI_VERIFICATION_NEEDS: "build,test,eslint,prettier,security-audit,bundle-size"
        run: node scripts/generate-release-evidence.mjs
      - name: Hash admitted release artifact
        run: node scripts/build-artifact-manifest.mjs --root static --output release-artifact-manifest.json --revision "$GITHUB_SHA"
      - name: Upload exact-revision release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-${{ github.sha }}
          path: |
            static/release-evidence.json
            release-artifact-manifest.json
          retention-days: 30
